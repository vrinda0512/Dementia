<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8a4b2f"/>
      <stop offset="1" stop-color="#6a3f28"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="rgba(255,255,255,0)"/>
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#g1)" rx="24"/>
  <rect x="40" y="60" width="720" height="1080" rx="18" fill="url(#dots)" opacity="0.06" />

  <g transform="translate(80,120)">
    <rect x="0" y="0" width="640" height="960" rx="8" fill="#fff3e6"/>
    <rect x="18" y="18" width="604" height="924" rx="6" fill="#fffaf0"/>

    <text x="40" y="80" font-family="Georgia, serif" font-weight="700" font-size="36" fill="#7a4b2d">MEMORA</text>
    <text x="40" y="120" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#a65e3b">Memory Journey</text>

    <g transform="translate(40,160)">
      <rect x="0" y="0" width="520" height="360" rx="12" fill="#fdebd3"/>
      <text x="24" y="60" font-family="Georgia, serif" font-weight="800" font-size="28" fill="#5b3b2a">My Morning</text>
      <circle cx="460" cy="56" r="36" fill="#ffd27a" />
    </g>
  </g>
</svg>
